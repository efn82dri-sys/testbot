<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0C0E10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2EEE8" media="(prefers-color-scheme: light)">
<title>پالت‌های رنگی — رواق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="/palettes/styles.css">
</head>
<body>

<div class="bg" aria-hidden="true">
  <span class="orb orb-a"></span>
  <span class="orb orb-b"></span>
  <span class="orb orb-c"></span>
  <span class="grain"></span>
</div>

<header class="app-bar">
  <div class="brand">
    <span class="dot"></span>
    <span>رواق — پالت رنگ</span>
  </div>
  <div class="app-actions">
    <button class="icon-btn" id="favBtn" aria-label="نمایش علاقه‌مندی‌ها" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      <span class="fav-count" id="favCount" hidden>0</span>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="تغییر حالت نمایش">
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>
</header>

<main class="wrap">

  <section class="hero">
    <span class="eyebrow"><i></i>مجموعه رنگ اختصاصی رواق</span>
    <h1>ترکیب‌رنگ‌هایی برای فضای داخلی</h1>
    <p>هر پالت را روی دیوار، متریال یا مبلمان امتحان کن. روی هر رنگ بزن تا کد هگز آن کپی شود.</p>
    <div class="hero-meta">
      <span class="pill" id="countPill">…</span>
      <span class="pill pill-ghost" id="hintPill">Ctrl / ⌘ + K برای جست‌وجو</span>
    </div>
  </section>

  <section class="filters">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input id="search" type="search" placeholder="جست‌وجوی نام، برچسب یا کد رنگ…" autocomplete="off" spellcheck="false">
      <button class="search-clear" id="searchClear" hidden aria-label="پاک‌کردن جست‌وجو">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="chips" id="chips" role="tablist"></div>
  </section>

  <section class="list" id="list" aria-live="polite"></section>

  <footer class="foot">
    <span>رواق — مرجع فایل‌های معماری و عمران</span>
    <span class="heart">ساخته‌شده با ♥ برای معمارها</span>
  </footer>

</main>

<button class="to-top" id="toTop" hidden aria-label="بازگشت به بالا">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/palettes/script.js" defer></script>
<script src="/palettes/studio.js?v=4" defer></script>
</body>
</html>
