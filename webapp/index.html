<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>حضور و غیاب | رواق</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @font-face {
      font-family: 'Kalameh';
      src: url('fonts/Kalameh-Regular.woff2') format('woff2'),
           url('fonts/Kalameh-Regular.woff') format('woff');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Kalameh';
      src: url('fonts/Kalameh-Bold.woff2') format('woff2'),
           url('fonts/Kalameh-Bold.woff') format('woff');
      font-weight: 700;
      font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Kalameh', Tahoma, sans-serif;
      background: #1a1e1a;
      color: #f0ece4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
    }
    .container {
      max-width: 400px;
      width: 100%;
      text-align: center;
      padding: 30px 20px;
      background: rgba(30, 35, 30, 0.8);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      border: 1px solid rgba(201, 168, 108, 0.2);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; color: #c9a86c; margin-bottom: 8px; }
    .sub { font-size: 14px; color: #8b9a7a; margin-bottom: 24px; line-height: 1.6; }
    .btn-primary {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #c9a86c, #b8925a);
      color: #1a1e1a;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 24px rgba(201,168,108,0.3);
    }
    .btn-primary:active { transform: scale(0.96); }
    .btn-primary:disabled { opacity: 0.5; filter: grayscale(0.6); pointer-events: none; }
    .btn-success {
      background: #2d6a4f;
      color: #fff;
      box-shadow: 0 4px 24px rgba(45, 106, 79, 0.3);
    }
    .btn-success:disabled { opacity: 0.6; }
    .status-box {
      margin-top: 20px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      font-size: 14px;
      color: #b8b0a0;
    }
    .status-box.success { color: #7ecf9a; background: rgba(126, 207, 154, 0.1); }
    .status-box.error { color: #e2665a; background: rgba(226, 102, 90, 0.1); }
    .status-box.info { color: #c9a86c; background: rgba(201, 168, 108, 0.1); }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🏛</div>
    <h1>حضور و غیاب هفتگی</h1>
    <p class="sub">
      با ثبت حضور، نشان می‌دهی که همچنان در این رواق همراه ما هستی.
    </p>
    <button class="btn-primary" id="attendBtn">✅ ثبت حضور</button>
    <div class="status-box" id="statusBox">برای ثبت حضور، روی دکمه کلیک کن.</div>
  </div>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const btn = document.getElementById('attendBtn');
    const statusBox = document.getElementById('statusBox');

    async function recordAttendance() {
      btn.disabled = true;
      btn.textContent = '⏳ در حال ثبت...';
      statusBox.className = 'status-box info';
      statusBox.textContent = 'در حال ارتباط با سرور...';

      try {
        const res = await fetch('/api/attendance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: tg.initData }),
        });
        const data = await res.json();

        if (data.ok) {
          if (data.status === 'already_attended') {
            statusBox.className = 'status-box info';
            statusBox.textContent = '✅ حضور شما قبلاً ثبت شده است.';
          } else {
            statusBox.className = 'status-box success';
            statusBox.textContent = '✅ حضور شما با موفقیت ثبت شد. از همراهی‌تان سپاسگزاریم!';
            btn.className = 'btn-primary btn-success';
            btn.textContent = '✅ ثبت شد';
          }
        } else {
          throw new Error(data.error || 'unknown');
        }
      } catch (err) {
        statusBox.className = 'status-box error';
        statusBox.textContent = '❌ مشکلی پیش آمد. لطفاً دوباره تلاش کنید.';
        btn.disabled = false;
        btn.textContent = '✅ ثبت حضور';
      }
    }

    btn.addEventListener('click', recordAttendance);
    tg.BackButton && tg.BackButton.hide();
  </script>
</body>
</html>
